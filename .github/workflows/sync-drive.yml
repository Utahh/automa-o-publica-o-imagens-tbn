name: Sincronizar imóveis do Google Drive

on:
  schedule:
    # A cada 5 minutos — o mínimo permitido pelo GitHub. Só é seguro rodar
    # com essa frequência porque o repositório é público (Actions
    # ilimitado e grátis); em repositório privado isso estouraria a cota
    # de 2.000 min/mês. O agendador do GitHub não é exato sob carga —
    # trate como "em até ~5-10 min", não como um relógio preciso.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # botão "Run workflow" na aba Actions, para publicar na hora

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar sincronização
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          DRIVE_ENVIO_FOLDER_ID: ${{ vars.DRIVE_ENVIO_FOLDER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: npm run sync-drive
